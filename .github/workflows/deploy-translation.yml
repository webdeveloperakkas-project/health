name: Deploy translation Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/translate-content/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-translation.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: oxxnjxrunvhrfwxdvbsr
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Verify deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "Missing Supabase project ID" && exit 1)

      - name: Deploy translation function
        run: supabase functions deploy translate-content --project-ref "$SUPABASE_PROJECT_ID" --yes
